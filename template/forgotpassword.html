<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Background */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("https://png.pngtree.com/png-clipart/20220404/original/pngtree-blue-404-web-design-login-page-background-illustration-png-image_7500986.png") no-repeat center;
            background-size: cover;
            position: relative;
        }

        /* Overlay */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #2b1055, #7597de);
            opacity: 0.7;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        /* Glass Card */
        .forgot-box {
            width: 350px;
            padding: 40px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            color: white;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }

        .forgot-box h2 {
            margin-bottom: 25px;
            font-size: 28px;
        }

        .forgot-box p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Input */
        .input-box {
            position: relative;
            margin: 20px 0;
        }

        .input-box input {
            width: 100%;
            padding: 12px 40px 12px 10px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #ddd;
            pointer-events: none;
            transition: 0.3s;
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -8px;
            font-size: 12px;
            color: #fff;
        }

        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            background: white;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff6a00;
            color: white;
        }

        /* Links */
        a {
            color: #ffd700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="forgot-box">
        <h2>Forgot Password</h2>
        <p>Enter your email address and we will send you a link to reset your password.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <input type="email" name="email" required>
                <label>Email Address</label>
                <i class="fa fa-envelope"></i>
            </div>
            <button type="submit" class="btn">Send Reset Link</button>

            <p><a href="{% url 'login' %}">Back to Login</a></p>
        </form>
    </div>
</div>
</body>
</html>
